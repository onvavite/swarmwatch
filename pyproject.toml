[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmwatch"
version = "0.1.0"
description = "Forensic monitor for hidden coordination in multi-agent logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Onvavite" }]
keywords = ["multi-agent", "oversight", "forensics", "ai-safety", "swarm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/onvavite/swarmwatch"
Repository = "https://github.com/onvavite/swarmwatch"

[project.scripts]
swarmwatch = "swarmwatch.cli:main"

[tool.setuptools]
packages = ["swarmwatch"]
